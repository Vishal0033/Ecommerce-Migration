# RetailMax Ansible Inventory
# Populated with the EC2 Public IP provisioned by Terraform

[app_servers]
# Replace with the terraform output "ec2_public_ip" or DNS name
retailmax-prod ansible_host=100.58.244.39 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/retailmax-key.pem

[database]
# Optional if managed RDS or self-hosted PostgreSQL
# retailmax-db ansible_host=YOUR_DB_IP ansible_user=ubuntu

[monitoring]
retailmax-monitor ansible_host=YOUR_EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/retailmax-key.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
environment_name=production

