---
# RetailMax Global Ansible Variables

app_name: retailmax
app_directory: /opt/retailmax
docker_network: retailmax-net

# Docker image tags
image_backend: retailmax-backend:latest
image_frontend: retailmax-frontend:latest
docker_registry: "" # e.g. <account_id>.dkr.ecr.us-east-1.amazonaws.com/

# Blue-Green Deployment Configuration
blue_port: 5001
green_port: 5002
active_slot: "blue" # Set dynamically to "blue" or "green" during zero-downtime cutover

# Database Connection (AWS RDS or containerized)
db_host: "localhost" # or AWS RDS endpoint from Terraform output
db_port: 5432
db_name: "retailmax_db"
db_user: "retailmax_admin"
db_password: "RetailMaxSecurePass2026!"
database_url: "postgresql://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ db_name }}?schema=public"

# Security & Application Settings
jwt_secret: "retailmax-super-secret-jwt-key-2026-production-ready"
jwt_expires_in: "7d"
node_env: "production"

# Monitoring
node_exporter_port: 9100
prometheus_port: 9091
grafana_port: 3031

