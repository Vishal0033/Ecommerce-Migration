---
# Nginx Installation & Blue-Green Ingress Configuration
- name: Install Nginx web server
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Remove default Nginx site configuration
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy RetailMax Blue-Green Nginx configuration
  template:
    src: retailmax_nginx.conf.j2
    dest: /etc/nginx/sites-available/retailmax.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Nginx

- name: Enable RetailMax Nginx site
  file:
    src: /etc/nginx/sites-available/retailmax.conf
    dest: /etc/nginx/sites-enabled/retailmax.conf
    state: link
  notify: Reload Nginx

- name: Ensure Nginx service is running and enabled
  systemd:
    name: nginx
    state: started
    enabled: yes

