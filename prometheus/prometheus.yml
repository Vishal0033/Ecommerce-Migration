# RetailMax Prometheus Monitoring Configuration
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'retailmax-monolith'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']
        labels:
          environment: 'production'
          app: 'retailmax-monolith'

