# RetailMax Blue-Green Deployment & Load Balancing Configuration
# Supports zero-downtime cutover between Blue (Active) and Green (Staging) environments

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Dynamic upstream target: connects to backend service
    upstream retailmax_active_upstream {
        server backend:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        listen 5001;
        listen 5002;
        server_name _;

        # Health check endpoint for AWS Application Load Balancer
        location /health {
            proxy_pass http://retailmax_active_upstream/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            access_log off;
        }

        # Prometheus metrics endpoint
        location /metrics {
            proxy_pass http://retailmax_active_upstream/metrics;
            proxy_set_header Host $host;
        }

        # API routing
        location /api/ {
            proxy_pass http://retailmax_active_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend SPA reverse proxy
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

