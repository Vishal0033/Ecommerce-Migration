version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retailmax-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://retailmax_admin:RetailMaxSecurePass2026!@retailmax-postgres.cgxiws0ya25a.us-east-1.rds.amazonaws.com:5432/retailmax_db?schema=public
      JWT_SECRET: retailmax-super-secret-jwt-key-2026-production-ready
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://retailmax-alb-1087523635.us-east-1.elb.amazonaws.com
    ports:
      - "5050:5000"
    networks:
      - retailmax-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retailmax-frontend
    restart: always
    ports:
      - "3030:80"
    depends_on:
      - backend
    networks:
      - retailmax-network

  nginx:
    image: nginx:1.25-alpine
    container_name: retailmax-nginx-lb
    restart: always
    ports:
      - "80:80"
      - "5001:5001"
      - "5002:5002"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - retailmax-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: retailmax-prometheus
    restart: always
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    networks:
      - retailmax-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: retailmax-grafana
    restart: always
    ports:
      - "3031:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - retailmax-network

networks:
  retailmax-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

