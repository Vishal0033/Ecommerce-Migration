version: '3.8'

services:
  # Primary PostgreSQL Database (Target for Cloud Migration)
  postgres:
    image: postgres:16-alpine
    container_name: retailmax-postgres
    restart: always
    environment:
      POSTGRES_USER: retailmax
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: retailmax_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailmax -d retailmax_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retailmax-network

  # RetailMax Monolith Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retailmax-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://retailmax:securepassword123@postgres:5432/retailmax_db?schema=public
      JWT_SECRET: retailmax-super-secret-jwt-key-2026-production-ready
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:80
    ports:
      - "5050:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - retailmax-network

  # RetailMax Frontend Single Page Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retailmax-frontend
    restart: always
    ports:
      - "3030:80"
    depends_on:
      - backend
    networks:
      - retailmax-network

  # Nginx Reverse Proxy & Blue-Green Ingress Controller
  nginx:
    image: nginx:1.25-alpine
    container_name: retailmax-nginx-lb
    restart: always
    ports:
      - "80:80"
      - "5001:5001"
      - "5002:5002"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - retailmax-network

  # Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: retailmax-prometheus
    restart: always
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    networks:
      - retailmax-network

  # Grafana Performance Dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: retailmax-grafana
    restart: always
    ports:
      - "3031:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - retailmax-network

networks:
  retailmax-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
